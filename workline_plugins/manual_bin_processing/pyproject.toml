[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "wes-manual-bin-processing-plugin"
version = "0.1.0"
description = "Manual bin processing business decisions and WES application integration"
requires-python = ">=3.13"
dependencies = ["wes-plugin-sdk==0.1.0"]

[tool.uv.sources]
wes-plugin-sdk = { path = "../../packages/wes_plugin_sdk" }

[dependency-groups]
dev = [
    "basedpyright>=1.28.0",
    "pytest>=9.0.3",
    "ruff>=0.15.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/manual_bin_processing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../.."]
addopts = ["-q"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "B",
    "C4",
    "E",
    "F",
    "I",
    "N",
    "PERF",
    "PIE",
    "PL",
    "PT",
    "RET",
    "RSE",
    "RUF",
    "SIM",
    "UP",
]
ignore = [
    "PLR2004",
    "PLR0915",
    "PLC0415",
    "PT011",
    "PT018",
]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
"src/manual_bin_processing/application/*.py" = ["PLR0912", "PLR0913", "RUF002"]

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = ["src"]
extraPaths = ["src", "../..", "../../packages/wes_plugin_sdk/src"]
reportMissingImports = "error"
reportUndefinedVariable = "error"
