# ============================================
# PostgreSQL Logging Baseline
# ============================================
# 目标:
# - 容器化部署下统一输出到 stderr，由 Docker 接管日志轮转
# - 保留错误、锁等待等高价值信号
# - 避免低价值连接噪音淹没真正的问题

# 容器场景下直接写 stderr，交给 Docker logging driver 管理
logging_collector = off
log_destination = 'stderr'

# Docker 网络内需要接受其他服务连接，不能只监听 localhost
listen_addresses = '*'

# TimescaleDB 扩展已安装在业务库中；DDL 会触发扩展 hook，必须在启动时预加载
shared_preload_libraries = 'timescaledb'

# 日志统一使用 UTC，便于跨服务对齐时间线
log_timezone = 'UTC'

# 打出进程、数据库、用户、应用名、客户端，便于定位来源
log_line_prefix = '%m [%p] db=%d,user=%u,app=%a,client=%h '

# 锁等待是定位并发问题的高价值信号，应在所有环境保留
log_lock_waits = on
deadlock_timeout = '1s'

# SQL 出错时保留对应语句，便于复盘失败上下文
log_min_error_statement = error
