# ============================================
# PostgreSQL Logging - Production
# ============================================
# 目标:
# - 稳定性
# - 性能回溯
# - 事故复盘

include_if_exists = '/etc/postgresql/base.conf'

log_min_messages = warning

# 生产环境不记录全量 SQL，避免 I/O、存储与敏感信息风险
log_statement = 'none'

# 保留慢 SQL，作为容量与性能退化的核心信号
log_min_duration_statement = 500

# 默认关闭连接生命周期日志，避免连接池活动淹没关键事件
log_connections = off
log_disconnections = off

# 生产环境保留 checkpoint，有助于写放大与 I/O 抖动分析
log_checkpoints = on
