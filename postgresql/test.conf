# ============================================
# PostgreSQL Logging - Test
# ============================================
# 目标:
# - 失败定位
# - CI 可读
# - 保留错误、DDL、锁等待与更敏感的慢 SQL

include_if_exists = '/etc/postgresql/base.conf'

log_min_messages = warning

# 保留 DDL，便于排查迁移、fixture 初始化与 schema 差异
log_statement = 'ddl'

# 测试环境更关注退化，阈值略低于开发环境
log_min_duration_statement = 200

# 连接/断开日志对 CI 价值低、噪音高，默认关闭
log_connections = off
log_disconnections = off

# 测试环境优先关注用例失败而非 checkpoint 噪音
log_checkpoints = off
