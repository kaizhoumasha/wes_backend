# ============================================
# PostgreSQL Logging - Development
# ============================================
# 目标:
# - 快速调试
# - 低噪音
# - 默认保留错误、DDL 与慢 SQL

include_if_exists = '/etc/postgresql/base.conf'

# 开发环境默认只看 warning 及以上，避免 notice/info 淹没终端
log_min_messages = warning

# 仅记录 DDL，便于排查迁移与表结构问题
log_statement = 'ddl'

# 记录慢 SQL，但阈值相对宽松，减少本地开发噪音
log_min_duration_statement = 300

# 连接池、健康检查与热重载会频繁建连；默认关闭连接生命周期日志
log_connections = off
log_disconnections = off

# 开发环境不默认关注 checkpoint 细节，需要时再临时开启
log_checkpoints = off
