# ============================================
# WMS Mock 最终镜像验收
# ============================================
# 该配置刻意不声明 build、源码挂载或 reload，确保真实 TCP/CLI 验收的是
# 已构建镜像本身，而不是宿主机工作树中的 tests/mock。
services:
  mock_wms_acceptance:
    image: ${MOCK_WMS_ACCEPTANCE_IMAGE:-wes-mock:wms}
    restart: "no"
    ports:
      - "${DOCKER_HOST_BIND_IP:-127.0.0.1}:${MOCK_WMS_ACCEPTANCE_PORT:-18011}:8011"
    working_dir: /app/tests/mock
    command: >
      python -m uvicorn
      wms_mock_server:app
      --host 0.0.0.0
      --port 8011
      --log-level info
      --no-access-log
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      NO_PROXY: "*"
      no_proxy: "*"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WES_TRANSPORT_EVENT_URL: ${CONTAINER_WES_TRANSPORT_EVENT_URL:?required}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8011/"]
      interval: 2s
      timeout: 1s
      retries: 15
      start_period: 2s
