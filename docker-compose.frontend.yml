services:
  api:
    environment:
      WMS_PROVIDER_PROFILE_FILE: /run/wes/wms-provider.yaml
    volumes:
      - ./deployment/dev/wms-provider.yaml:/run/wes/wms-provider.yaml:ro

  celery:
    environment:
      WMS_PROVIDER_PROFILE_FILE: /run/wes/wms-provider.yaml
    volumes:
      - ./deployment/dev/wms-provider.yaml:/run/wes/wms-provider.yaml:ro

  celery-wms-fulfillment:
    environment:
      WMS_PROVIDER_PROFILE_FILE: /run/wes/wms-provider.yaml
    volumes:
      - ./deployment/dev/wms-provider.yaml:/run/wes/wms-provider.yaml:ro

  celery_beat:
    environment:
      WMS_PROVIDER_PROFILE_FILE: /run/wes/wms-provider.yaml
    volumes:
      - ./deployment/dev/wms-provider.yaml:/run/wes/wms-provider.yaml:ro

  frontend:
    image: node:22-bookworm-slim
    container_name: wes_frontend_${ENV:-dev}
    restart: ${RESTART_POLICY:-unless-stopped}
    working_dir: /app
    command: ["sh", "/usr/local/bin/frontend-dev-entrypoint.sh"]
    ports:
      - "${DOCKER_HOST_BIND_IP:-127.0.0.1}:${FRONTEND_PORT:-5173}:5173"
    env_file:
      - ${FRONTEND_ENV_FILE:-.env.frontend.dev}
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      FRONTEND_APP_DIR: /app
      PNPM_HOME: /pnpm
      PNPM_STORE_DIR: /pnpm/store
      # Docker Desktop/macOS 的文件事件可能丢失，轮询保证 Vite HMR 可重复触发。
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    volumes:
      - ${FRONTEND_ROOT:-../wes_frontend}:/app:rw
      - ./scripts/frontend-dev-entrypoint.sh:/usr/local/bin/frontend-dev-entrypoint.sh:ro
      - frontend_node_modules:/app/node_modules
      - frontend_pnpm_store:/pnpm/store
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.FRONTEND_PORT || '5173')).then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - wesp9-network
    dns:
      - 8.8.8.8
      - 114.114.114.114
    profiles:
      - dev
      - test

  nginx:
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    profiles:
      - dev
      - test

volumes:
  frontend_node_modules:
    name: wes_frontend_node_modules_${ENV:-dev}
  frontend_pnpm_store:
    name: wes_frontend_pnpm_store_${ENV:-dev}
