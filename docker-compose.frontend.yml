services:
  api:
    container_name: ${COMPOSE_PROJECT_NAME:-wes_backend_dev}_api

  celery:
    container_name: ${COMPOSE_PROJECT_NAME:-wes_backend_dev}_celery

  celery-wms-fulfillment:
    container_name: ${COMPOSE_PROJECT_NAME:-wes_backend_dev}_celery_wms_fulfillment

  celery_beat:
    container_name: ${COMPOSE_PROJECT_NAME:-wes_backend_dev}_celery_beat

  db:
    container_name: ${COMPOSE_PROJECT_NAME:-wes_backend_dev}_postgres

  redis:
    container_name: ${COMPOSE_PROJECT_NAME:-wes_backend_dev}_redis

  mock_ecs:
    container_name: ${COMPOSE_PROJECT_NAME:-wes_backend_dev}_mock_ecs

  mock_wms:
    container_name: ${COMPOSE_PROJECT_NAME:-wes_backend_dev}_mock_wms

  frontend:
    image: node:22-bookworm-slim
    container_name: ${COMPOSE_PROJECT_NAME:-wes_backend_dev}_frontend
    restart: ${RESTART_POLICY:-unless-stopped}
    working_dir: /app
    command: ["sh", "/usr/local/bin/frontend-dev-entrypoint.sh"]
    ports:
      - "${DOCKER_HOST_BIND_IP:-127.0.0.1}:${FRONTEND_PORT:-5173}:5173"
    env_file:
      - ${FRONTEND_ENV_FILE:-.env.frontend.dev}
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      FRONTEND_APP_DIR: /app
      PNPM_HOME: /pnpm
      PNPM_STORE_DIR: /pnpm/store
      # Docker Desktop/macOS 的文件事件可能丢失，轮询保证 Vite HMR 可重复触发。
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    volumes:
      - ${FRONTEND_ROOT:-../wes_frontend}:/app:rw
      - ./scripts/frontend-dev-entrypoint.sh:/usr/local/bin/frontend-dev-entrypoint.sh:ro
      - frontend_node_modules:/app/node_modules
      - frontend_pnpm_store:/pnpm/store
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.FRONTEND_PORT || '5173')).then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - wesp9-network
    dns:
      - 8.8.8.8
      - 114.114.114.114
    profiles:
      - dev
      - test

  nginx:
    container_name: ${COMPOSE_PROJECT_NAME:-wes_backend_dev}_nginx
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    profiles:
      - dev
      - test

volumes:
  frontend_node_modules:
    name: ${COMPOSE_PROJECT_NAME:-wes_backend_dev}_frontend_node_modules
  frontend_pnpm_store:
    name: ${COMPOSE_PROJECT_NAME:-wes_backend_dev}_frontend_pnpm_store
