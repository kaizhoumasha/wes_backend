# HEAVY selector 的机器可读真源。分类顺序固定为：直接 HEAVY 测试、候选 mapping、ignore。
ignore_globs = [
    "docs/**",
    "*.md",
    "tests/**",
    "Jenkinsfile",
    "Jenkinsfile.test-deploy",
    ".githooks/**",
    ".github/**",
    ".gitlab-ci.yml",
    "README*",
    "LICENSE*",
]

