# HEAVY selector 的机器可读真源。分类顺序固定为：直接 HEAVY 测试、候选 mapping、ignore。
ignore_globs = [
    "docs/**",
    "*.md",
    "tests/**",
    "Jenkinsfile",
    ".githooks/**",
    ".github/**",
    ".gitlab-ci.yml",
    "README*",
    "LICENSE*",
]

# selector 实现由 QUALITY 脚本合同承接，不触发运行时 HEAVY 测试。
[[mapping]]
source_glob = "scripts/select_heavy_tests.py"
heavy_tests = []

# 质量门禁只编排 FAST/QUALITY；生产 closure 由 HEAVY selector 独立承接。
[[mapping]]
source_glob = "scripts/git-quality-gate.sh"
heavy_tests = []

# WMS deployment attestation 的 CLI、领域事实与 Beat 路由必须共同验证四角色部署产物。
[[mapping]]
source_glob = "scripts/check_wms_deployment_attestation.py"
heavy_tests = ["tests/integration/test_wms_deployment_attestation.py"]

[[mapping]]
source_glob = "src/app/wms_integration/deployment_attestation.py"
heavy_tests = ["tests/integration/test_wms_deployment_attestation.py"]

# Runtime production E2E、benchmark artifact/CLI 与可穷尽的直接生产对象由对应 HEAVY 承接。
[[mapping]]
source_glob = "scripts/check_runtime_production_e2e_gate.py"
heavy_tests = ["tests/integration/test_runtime_production_closure_contract.py"]

[[mapping]]
source_glob = "scripts/run_runtime_benchmarks.py"
heavy_tests = ["tests/integration/test_runtime_production_closure_contract.py"]

[[mapping]]
source_glob = "tests/load/runtime_benchmark_scenarios.py"
heavy_tests = [
    "tests/integration/test_runtime_production_closure_contract.py",
    "tests/load/test_ecs_status_command_benchmark.py",
    "tests/load/test_plane_snapshot_benchmark.py",
]

[[mapping]]
source_glob = "tests/load/fixtures/runtime_benchmark_artifact.json"
heavy_tests = ["tests/integration/test_runtime_production_closure_contract.py"]

[[mapping]]
source_glob = "src/app/runtime/orchestration/p0_e2e_gate.py"
heavy_tests = ["tests/integration/test_runtime_production_closure_contract.py"]

[[mapping]]
source_glob = "src/app/runtime/orchestration/scenario_replay.py"
heavy_tests = [
    "tests/integration/test_runtime_production_closure_contract.py",
    "tests/resilience/test_runtime_scenario_replay.py",
]

[[mapping]]
source_glob = "src/app/runtime/orchestration/benchmark_gate.py"
heavy_tests = ["tests/integration/test_runtime_production_closure_contract.py"]

# fresh interpreter import 独立验证 EFFECT 合同模块没有隐藏的进程级导入依赖。
[[mapping]]
source_glob = "src/app/runtime/orchestration/effect_state_contract.py"
heavy_tests = ["tests/integration/test_effect_contract_fresh_import.py"]

[[mapping]]
source_glob = "src/app/runtime/orchestration/effect_bridges.py"
heavy_tests = [
    "tests/integration/test_effect_contract_fresh_import.py",
    "tests/integration/workline_capabilities/test_effect_reducer_postgresql.py",
]

# WMS 北向可行性探针只承接核心 HTTP/CLI/安全与 deadline 可靠性；具体工作线规则由插件包独立拥有。
[[mapping]]
source_glob = "scripts/verify_wms_northbound_feasibility.py"
heavy_tests = [
    "tests/integration/test_wms_mock_northbound_live.py",
    "tests/integration/test_wms_northbound_feasibility_probe.py",
