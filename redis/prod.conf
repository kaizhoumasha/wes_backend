# ============================================
# Redis - Production
# ============================================
# 目标:
# - 稳定性
# - 可恢复性
# - 性能观测

include /usr/local/etc/redis/base.conf

# 保留 RDB，提供周期性快照
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes

# 生产环境启用 AOF，提高 broker/result/cache 混用场景下的恢复能力
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no

# 当前 Redis 同时承载 Celery broker/result 与 cache，优先保护数据不被淘汰
maxmemory 2gb
maxmemory-policy noeviction
maxmemory-samples 5

# 生产环境保留慢命令与延迟观测，但阈值不宜过低
slowlog-log-slower-than 10000
latency-monitor-threshold 100
