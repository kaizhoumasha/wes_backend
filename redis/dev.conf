# ============================================
# Redis - Development
# ============================================
# 目标:
# - 本地调试稳定优先
# - 保留基础持久化
# - 降低观测阈值，便于发现热点命令

include /usr/local/etc/redis/base.conf

# 开发环境保留轻量 RDB，容器重启后尽量减少状态丢失
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes

# 本地开发不启用 AOF，减少磁盘放大与噪音
appendonly no

# 项目当前混用 Celery broker/result 与 cache，不能使用 allkeys-lru
maxmemory 512mb
maxmemory-policy noeviction
maxmemory-samples 5

# 开发环境更积极记录慢命令与延迟
slowlog-log-slower-than 5000
latency-monitor-threshold 50
