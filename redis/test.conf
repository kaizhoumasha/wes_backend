# ============================================
# Redis - Test
# ============================================
# 目标:
# - 尽量接近生产行为
# - 保持 CI 可重复
# - 对慢命令更敏感

include /usr/local/etc/redis/base.conf

save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes

# 测试环境仍以速度为先，不默认打开 AOF
appendonly no

# 继续避免共享实例下误淘汰 Celery 队列/结果键
maxmemory 512mb
maxmemory-policy noeviction
maxmemory-samples 5

# 测试环境更容易捕获性能退化
slowlog-log-slower-than 3000
latency-monitor-threshold 25
