# ============================================
# Redis Baseline
# ============================================
# 目标:
# - 容器内前台运行，日志交给 Docker 接管
# - 保留慢命令与延迟观测
# - 将缓存/队列混用场景下的危险默认值收紧

# 网络配置
bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# 容器运行方式
daemonize no
supervised no
pidfile /var/run/redis.pid
loglevel notice
logfile ""
databases 16

# 数据目录
dir /data
dbfilename dump.rdb

# 安全配置
# requirepass 在 docker-compose 中通过命令行参数设置

# 慢命令与延迟观测
slowlog-max-len 256
latency-monitor-threshold 100

# 默认关闭事件通知，避免无谓开销
notify-keyspace-events ""

# 通用性能配置
activerehashing yes
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60
hz 10
dynamic-hz yes
aof-rewrite-incremental-fsync yes
rdb-save-incremental-fsync yes
