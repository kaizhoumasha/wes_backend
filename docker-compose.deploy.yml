services:
  api:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    container_name: wes_api_${ENV:-prod}
    restart: ${RESTART_POLICY:-unless-stopped}
    ports: !override
      - "${APP_HOST_PORT:-8001}:8001"
    env_file:
      - ${BACKEND_ENV_FILE:-.env}
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8001
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DATABASE_RUNTIME_ROLE: api
      DATABASE_POOL_SIZE: 5
      DATABASE_MAX_OVERFLOW: 0
      DATABASE_POOL_TIMEOUT: 30
      DATABASE_APPLICATION_NAME: ${ENV:-prod}
      WMS_DEPLOYMENT_ROLE: api
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT}/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT}/2
      WMS_PROVIDER_PROFILE_FILE: /run/wes/wms-provider.yaml
      WMS_EFFECT_ADMISSION_ENABLED: ${WMS_EFFECT_ADMISSION_ENABLED:-false}
      WMS_EFFECT_STATUS_TIMEOUT_SECONDS: ${WMS_EFFECT_STATUS_TIMEOUT_SECONDS}
      WMS_EFFECT_STATUS_MAX_RESPONSE_BYTES: ${WMS_EFFECT_STATUS_MAX_RESPONSE_BYTES}
      WMS_EFFECT_IDEMPOTENCY_RETENTION_SECONDS: ${WMS_EFFECT_IDEMPOTENCY_RETENTION_SECONDS}
      WMS_EFFECT_STATUS_VISIBILITY_SLA_SECONDS: ${WMS_EFFECT_STATUS_VISIBILITY_SLA_SECONDS}
      WES_EFFECT_MAX_CONFIRMATION_AGE_SECONDS: ${WES_EFFECT_MAX_CONFIRMATION_AGE_SECONDS}
      WES_EFFECT_NOT_FOUND_GRACE_SECONDS: ${WES_EFFECT_NOT_FOUND_GRACE_SECONDS}
      WES_EFFECT_STATUS_SAFETY_MARGIN_SECONDS: ${WES_EFFECT_STATUS_SAFETY_MARGIN_SECONDS}
      WES_EFFECT_STATUS_SCAN_BATCH_SIZE: ${WES_EFFECT_STATUS_SCAN_BATCH_SIZE}
      WES_EFFECT_STATUS_MAX_IN_FLIGHT: ${WES_EFFECT_STATUS_MAX_IN_FLIGHT}
      WES_EFFECT_STATUS_CLAIM_LEASE_SECONDS: ${WES_EFFECT_STATUS_CLAIM_LEASE_SECONDS}
      WES_EFFECT_STATUS_MAX_QUERY_ATTEMPTS: ${WES_EFFECT_STATUS_MAX_QUERY_ATTEMPTS}
      WES_EFFECT_STATUS_INITIAL_BACKOFF_SECONDS: ${WES_EFFECT_STATUS_INITIAL_BACKOFF_SECONDS}
      WES_EFFECT_STATUS_MAX_BACKOFF_SECONDS: ${WES_EFFECT_STATUS_MAX_BACKOFF_SECONDS}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON_OUTPUT: ${LOG_JSON_OUTPUT:-true}
    # 生产运行只使用镜像内代码；显式替换基础 Compose 的开发源码挂载。
    volumes: !override
      - ./logs:/app/logs
      - "${WMS_PROVIDER_PROFILE_HOST_FILE:?WMS_PROVIDER_PROFILE_HOST_FILE is required}:/run/wes/wms-provider.yaml:ro"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - wesp9-network
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILES:-3}"

  celery:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    restart: ${RESTART_POLICY:-unless-stopped}
    command: >
      sh -c '
      if [ "${ENV:-prod}" = "dev" ]; then
        exec sh /app/src/celery_app/dev_worker_autoreload.sh;
      else
        exec celery -A src.celery_app.app worker --loglevel=${CELERY_LOG_LEVEL:-INFO} --concurrency=$${CELERY_WORKER_CONCURRENCY} --max-tasks-per-child=${CELERY_MAX_TASKS:-1000} --queues=$${CELERY_WORKER_QUEUES};
      fi
      '
    env_file:
      - ${BACKEND_ENV_FILE:-.env}
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DATABASE_RUNTIME_ROLE: celery
      DATABASE_POOL_SIZE: 1
      DATABASE_MAX_OVERFLOW: 0
      DATABASE_POOL_TIMEOUT: 30
      DATABASE_APPLICATION_NAME: ${ENV:-prod}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT}/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT}/2
      CELERY_WORKER_QUEUES: default,celery,device
      CELERY_WORKER_CONCURRENCY: ${CELERY_CONCURRENCY:-4}
      WMS_PROVIDER_PROCESS_ROLE: wes
      WMS_DEPLOYMENT_ROLE: wes-worker
      WMS_PROVIDER_PROFILE_FILE: /run/wes/wms-provider.yaml
      WMS_EFFECT_ADMISSION_ENABLED: ${WMS_EFFECT_ADMISSION_ENABLED:-false}
      WMS_EFFECT_STATUS_TIMEOUT_SECONDS: ${WMS_EFFECT_STATUS_TIMEOUT_SECONDS}
      WMS_EFFECT_STATUS_MAX_RESPONSE_BYTES: ${WMS_EFFECT_STATUS_MAX_RESPONSE_BYTES}
      WMS_EFFECT_IDEMPOTENCY_RETENTION_SECONDS: ${WMS_EFFECT_IDEMPOTENCY_RETENTION_SECONDS}
      WMS_EFFECT_STATUS_VISIBILITY_SLA_SECONDS: ${WMS_EFFECT_STATUS_VISIBILITY_SLA_SECONDS}
      WES_EFFECT_MAX_CONFIRMATION_AGE_SECONDS: ${WES_EFFECT_MAX_CONFIRMATION_AGE_SECONDS}
      WES_EFFECT_NOT_FOUND_GRACE_SECONDS: ${WES_EFFECT_NOT_FOUND_GRACE_SECONDS}
      WES_EFFECT_STATUS_SAFETY_MARGIN_SECONDS: ${WES_EFFECT_STATUS_SAFETY_MARGIN_SECONDS}
      WES_EFFECT_STATUS_SCAN_BATCH_SIZE: ${WES_EFFECT_STATUS_SCAN_BATCH_SIZE}
      WES_EFFECT_STATUS_MAX_IN_FLIGHT: ${WES_EFFECT_STATUS_MAX_IN_FLIGHT}
      WES_EFFECT_STATUS_CLAIM_LEASE_SECONDS: ${WES_EFFECT_STATUS_CLAIM_LEASE_SECONDS}
      WES_EFFECT_STATUS_MAX_QUERY_ATTEMPTS: ${WES_EFFECT_STATUS_MAX_QUERY_ATTEMPTS}
      WES_EFFECT_STATUS_INITIAL_BACKOFF_SECONDS: ${WES_EFFECT_STATUS_INITIAL_BACKOFF_SECONDS}
      WES_EFFECT_STATUS_MAX_BACKOFF_SECONDS: ${WES_EFFECT_STATUS_MAX_BACKOFF_SECONDS}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON_OUTPUT: ${LOG_JSON_OUTPUT:-true}
    # 生产运行只使用镜像内代码；显式替换基础 Compose 的开发源码挂载。
    volumes: !override
      - ./logs:/app/logs
      - "${WMS_PROVIDER_PROFILE_HOST_FILE:?WMS_PROVIDER_PROFILE_HOST_FILE is required}:/run/wes/wms-provider.yaml:ro"
    networks:
      - wesp9-network
    stop_grace_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILES:-3}"

  celery-wms-fulfillment:
    extends:
      service: celery
    command: >
      celery -A src.celery_app.app worker
      --loglevel=${CELERY_LOG_LEVEL:-INFO}
      --concurrency=1
      --max-tasks-per-child=${CELERY_MAX_TASKS:-1000}
      --queues=wms-fulfillment
    environment:
      CELERY_WORKER_QUEUES: wms-fulfillment
      CELERY_WORKER_CONCURRENCY: "1"
      WMS_PROVIDER_PROCESS_ROLE: fulfillment
      WMS_DEPLOYMENT_ROLE: fulfillment-worker
    # 生产运行只使用镜像内代码；显式替换基础 Compose 的开发源码挂载。
    volumes: !override
      - ./logs:/app/logs
      - "${WMS_PROVIDER_PROFILE_HOST_FILE:?WMS_PROVIDER_PROFILE_HOST_FILE is required}:/run/wes/wms-provider.yaml:ro"
    deploy:
      replicas: 1

  celery_beat:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    container_name: wes_celery_beat_${ENV:-prod}
    restart: ${RESTART_POLICY:-unless-stopped}
    command: >
      sh -c '
      if [ "${ENV:-prod}" = "dev" ]; then
        exec sh /app/src/celery_app/dev_beat_autoreload.sh;
      else
        exec celery -A src.celery_app.app beat --loglevel=${CELERY_LOG_LEVEL:-INFO};
      fi
      '
    env_file:
      - ${BACKEND_ENV_FILE:-.env}
    environment:
      DATABASE_RUNTIME_ROLE: cli
      DATABASE_POOL_SIZE: 1
      DATABASE_MAX_OVERFLOW: 0
      WMS_DEPLOYMENT_ROLE: beat
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT}/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT}/2
      WMS_QUERY_IN_PROCESS_SIMULATION_ENABLED: ${WMS_QUERY_IN_PROCESS_SIMULATION_ENABLED:-false}
      WMS_MATERIAL_FLOW_SANDBOX_HMAC_SECRET_V1: ${WMS_MATERIAL_FLOW_SANDBOX_HMAC_SECRET_V1:-}
      WMS_MATERIAL_FLOW_STAGING_HMAC_SECRET_V1: ${WMS_MATERIAL_FLOW_STAGING_HMAC_SECRET_V1:-}
      WMS_MATERIAL_FLOW_PRODUCTION_HMAC_SECRET_V1: ${WMS_MATERIAL_FLOW_PRODUCTION_HMAC_SECRET_V1:-}
      WMS_MATERIAL_FLOW_SANDBOX_HMAC_SECRET_V2: ${WMS_MATERIAL_FLOW_SANDBOX_HMAC_SECRET_V2:-}
      WMS_MATERIAL_FLOW_STAGING_HMAC_SECRET_V2: ${WMS_MATERIAL_FLOW_STAGING_HMAC_SECRET_V2:-}
      WMS_MATERIAL_FLOW_PRODUCTION_HMAC_SECRET_V2: ${WMS_MATERIAL_FLOW_PRODUCTION_HMAC_SECRET_V2:-}
      WES_REVOKED_EXTERNAL_HTTP_CREDENTIAL_REFERENCES: ${WES_REVOKED_EXTERNAL_HTTP_CREDENTIAL_REFERENCES:-}
      WMS_PROVIDER_PROFILE_FILE: /run/wes/wms-provider.yaml
      WMS_EFFECT_ADMISSION_ENABLED: ${WMS_EFFECT_ADMISSION_ENABLED:-false}
      WMS_EFFECT_STATUS_TIMEOUT_SECONDS: ${WMS_EFFECT_STATUS_TIMEOUT_SECONDS}
      WMS_EFFECT_STATUS_MAX_RESPONSE_BYTES: ${WMS_EFFECT_STATUS_MAX_RESPONSE_BYTES}
      WMS_EFFECT_IDEMPOTENCY_RETENTION_SECONDS: ${WMS_EFFECT_IDEMPOTENCY_RETENTION_SECONDS}
      WMS_EFFECT_STATUS_VISIBILITY_SLA_SECONDS: ${WMS_EFFECT_STATUS_VISIBILITY_SLA_SECONDS}
      WES_EFFECT_MAX_CONFIRMATION_AGE_SECONDS: ${WES_EFFECT_MAX_CONFIRMATION_AGE_SECONDS}
      WES_EFFECT_NOT_FOUND_GRACE_SECONDS: ${WES_EFFECT_NOT_FOUND_GRACE_SECONDS}
      WES_EFFECT_STATUS_SAFETY_MARGIN_SECONDS: ${WES_EFFECT_STATUS_SAFETY_MARGIN_SECONDS}
      WES_EFFECT_STATUS_SCAN_BATCH_SIZE: ${WES_EFFECT_STATUS_SCAN_BATCH_SIZE}
      WES_EFFECT_STATUS_MAX_IN_FLIGHT: ${WES_EFFECT_STATUS_MAX_IN_FLIGHT}
      WES_EFFECT_STATUS_CLAIM_LEASE_SECONDS: ${WES_EFFECT_STATUS_CLAIM_LEASE_SECONDS}
      WES_EFFECT_STATUS_MAX_QUERY_ATTEMPTS: ${WES_EFFECT_STATUS_MAX_QUERY_ATTEMPTS}
      WES_EFFECT_STATUS_INITIAL_BACKOFF_SECONDS: ${WES_EFFECT_STATUS_INITIAL_BACKOFF_SECONDS}
      WES_EFFECT_STATUS_MAX_BACKOFF_SECONDS: ${WES_EFFECT_STATUS_MAX_BACKOFF_SECONDS}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON_OUTPUT: ${LOG_JSON_OUTPUT:-true}
    # 生产运行只使用镜像内代码；显式替换基础 Compose 的开发源码挂载。
    volumes: !override
      - ./logs:/app/logs
      - "${WMS_PROVIDER_PROFILE_HOST_FILE:?WMS_PROVIDER_PROFILE_HOST_FILE is required}:/run/wes/wms-provider.yaml:ro"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "tr '\\000' ' ' </proc/1/cmdline | grep -q 'celery.*beat' || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - wesp9-network
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILES:-3}"

  flower:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    container_name: wes_flower_${ENV:-prod}
    restart: ${RESTART_POLICY:-unless-stopped}
    ports: !override
      - "${FLOWER_PORT:-5555}:5555"
    command: >
      celery -A src.celery_app.app flower
      --port=5555
      --broker=redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT}/1
      --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-changeme}
    env_file:
      - ${BACKEND_ENV_FILE:-.env}
    environment:
      DATABASE_RUNTIME_ROLE: cli
      DATABASE_POOL_SIZE: 1
      DATABASE_MAX_OVERFLOW: 0
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT}/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT}/2
    # 生产运行只使用镜像内代码；显式替换基础 Compose 的开发源码挂载。
    volumes: !override
      - ./logs:/app/logs
    networks:
      - wesp9-network
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILES:-3}"

networks:
  wesp9-network:
    name: wesp9-${ENV:-prod}-network
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: wes_br_${ENV:-prod}
