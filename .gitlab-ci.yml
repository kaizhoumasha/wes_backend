# ==============================================
# GitLab CI/CD 配置 - P9 WES Backend
# ==============================================
# 架构:
#   - DevOps 环境: 192.168.0.220 (GitLab + Runner)
#   - 测试环境: 192.168.0.221 (自动部署)
#   - 构建策略: 测试服务器本地构建（避免 Registry 配置）
# ==============================================

# ==============================================
# 全局变量
# ==============================================
variables:
  # Python 版本
  PYTHON_VERSION: "3.13"
  # 包管理器版本
  UV_VERSION: "0.5.x"
  # 缓存前缀
  CACHE_KEY_PREFIX: "wes-backend"
  # 时区配置
  DATETIME_TIMEZONE: "Asia/Shanghai"
  # 部署配置
  DEPLOY_HOST: "192.168.0.221"
  DEPLOY_USER: "root"
  DEPLOY_PATH: "/opt/wes_backend"
  DEPLOY_ENV_FILE: ".env.test"
  DEPLOY_COMPOSE_FILE: "docker-compose.yml"
  DEPLOY_PROFILE: "test"
  # 健康检查配置
  HEALTH_CHECK_URL: "http://localhost:8001/api/health"
  HEALTH_CHECK_TIMEOUT: "30"
  HEALTH_CHECK_RETRIES: "5"

# ==============================================
# 全局默认配置
# ==============================================
default:
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
  # 缓存配置（基于 uv.lock 文件）
  cache:
    key:
      prefix: $CACHE_KEY_PREFIX
      files:
        - uv.lock
    paths:
      - .cache/uv
      - .cache/pip
      - .venv/
    policy: pull-push
  # 重试策略
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  # Artifacts 保留时间
  artifacts:
    expire_in: 7 days
  # 超时配置
  timeout: 30m

# ==============================================
# 流水线阶段
# ==============================================
stages:
  - prepare    # 准备：安装依赖
  - quality    # 质量：代码检查和测试（并行）
  - deploy     # 部署：部署到测试环境

# ==============================================
# 准备阶段：安装依赖
# ==============================================
prepare:dependencies:
  stage: prepare
  script:
    - echo "📦 安装项目依赖..."
    - uv sync --frozen --no-dev
    - echo "✅ 生产依赖安装完成"
  artifacts:
    paths:
      - .venv/
      - uv.lock
    expire_in: 1 hour
  only:
    - develop
    - main
    - merge_requests

prepare:dev-dependencies:
  stage: prepare
  script:
    - echo "📦 安装开发依赖..."
    - uv sync --frozen
    - echo "✅ 开发依赖安装完成"
  artifacts:
    paths:
      - .venv/
      - uv.lock
    expire_in: 1 hour
  only:
    - develop
    - main
    - merge_requests

# ==============================================
# 质量阶段：代码检查（并行执行）
# ==============================================
lint:format:
  stage: quality
  dependencies:
    - prepare:dev-dependencies
  script:
    - echo "🔍 检查代码格式 (Ruff Format)..."
    - uv run ruff format --check .
    - echo "✅ 代码格式检查通过"
  only:
    - develop
    - main
    - merge_requests

lint:check:
  stage: quality
  dependencies:
    - prepare:dev-dependencies
  script:
    - echo "🔍 检查代码质量 (Ruff Lint)..."
    - uv run ruff check . --output-format=github
    - echo "✅ 代码质量检查通过"
  allow_failure: true
  only:
    - develop
    - main
    - merge_requests

lint:security:
  stage: quality
  dependencies:
    - prepare:dev-dependencies
  script:
    - echo "🔍 安全检查 (Bandit)..."
    - uv run bandit -r src/ -f json -o bandit-report.json || true
    - uv run bandit -r src/ -f screen
    - echo "✅ 安全检查完成"
  artifacts:
    reports:
      sast: bandit-report.json
    paths:
      - bandit-report.json
    when: always
    expire_in: 7 days
  allow_failure: true
  only:
    - develop
    - main
    - merge_requests

# ==============================================
# 质量阶段：单元测试（并行执行）
# ==============================================
test:unit:
  stage: quality
  dependencies:
    - prepare:dev-dependencies
  services:
    - name: postgres:17-alpine
      alias: postgres
      variables:
        POSTGRES_DB: wes_test
        POSTGRES_USER: wes_user
        POSTGRES_PASSWORD: wes_password
    - name: redis:8-alpine
      alias: redis
  variables:
    DATABASE_URL: "postgresql+psycopg://wes_user:wes_password@postgres:5432/wes_test"
    REDIS_URL: "redis://redis:6379/1"
    ENVIRONMENT: test
    DATETIME_TIMEZONE: Asia/Shanghai
  script:
    - echo "🧪 运行单元测试..."
    - uv run pytest tests/ -v --tb=short --cov=src --cov-report=term-missing --cov-report=html:reports/coverage --cov-report=xml:reports/coverage.xml --junitxml=reports/junit.xml
    - echo "✅ 单元测试通过"
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: reports/coverage.xml
      junit: reports/junit.xml
    paths:
      - reports/coverage/
      - reports/junit.xml
      - reports/coverage.xml
    when: always
    expire_in: 7 days
  only:
    - develop
    - main
    - merge_requests

test:api-signature:
  stage: quality
  dependencies:
    - prepare:dev-dependencies
  services:
    - name: postgres:17-alpine
      alias: postgres
      variables:
        POSTGRES_DB: wes_test
        POSTGRES_USER: wes_user
        POSTGRES_PASSWORD: wes_password
    - name: redis:8-alpine
      alias: redis
  variables:
    DATABASE_URL: "postgresql+psycopg://wes_user:wes_password@postgres:5432/wes_test"
    REDIS_URL: "redis://redis:6379/1"
    ENVIRONMENT: test
  script:
    - echo "🔐 测试 API 签名认证..."
    - uv run pytest tests/api/test_signature.py -v --tb=short
    - echo "✅ API 签名测试通过"
  only:
    - develop
    - main
    - merge_requests

# ==============================================
# 部署阶段：部署到测试环境
# ==============================================
.deploy_template: &deploy_template
  image: alpine:latest
  before_script:
    # 安装必要工具
    - apk add --no-cache openssh-client curl
    # 配置 SSH
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - eval "$(ssh-agent -s)"
    - echo "$SSH_PRIVATE_KEY_TEST" | tr -d '\r' | ssh-add -
    - ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    # 验证 SSH 连接
    - echo "🔗 验证 SSH 连接..."
    - ssh -o ConnectTimeout=10 $DEPLOY_USER@$DEPLOY_HOST "echo '✅ SSH 连接成功'"

deploy:testing:
  <<: *deploy_template
  stage: deploy
  variables:
    GIT_STRATEGY: none  # 不需要在 Runner 上拉取代码
  script:
    - echo "🚀 开始部署到测试环境 ($DEPLOY_HOST)..."
    - |
      ssh $DEPLOY_USER@$DEPLOY_HOST bash -s << EOF
        set -e  # 遇到错误立即退出
        set -o pipefail  # 管道命令失败时退出

        # 颜色输出
        RED='\033[0;31m'
        GREEN='\033[0;32m'
        YELLOW='\033[1;33m'
        NC='\033[0m' # No Color

        echo -e "\${GREEN}📂 切换到项目目录...\${NC}"
        cd $DEPLOY_PATH || { echo -e "\${RED}❌ 项目目录不存在: $DEPLOY_PATH\${NC}"; exit 1; }

        echo -e "\${GREEN}📥 更新代码...\${NC}"
        # 保存当前提交（用于回滚）
        PREVIOUS_COMMIT=\$(git rev-parse HEAD)
        echo "📌 当前提交: \$PREVIOUS_COMMIT"

        # 拉取最新代码
        git fetch origin || { echo -e "\${RED}❌ Git fetch 失败\${NC}"; exit 1; }
        
        # 检出指定提交
        git checkout $CI_COMMIT_SHA || { echo -e "\${RED}❌ Git checkout 失败\${NC}"; exit 1; }
        
        # 显示新提交信息
        echo -e "\${GREEN}📌 新提交: \$(git log -1 --oneline)\${NC}"

        echo -e "\${GREEN}🔧 配置 Docker 镜像加速器...\${NC}"
        if [ ! -f /etc/docker/daemon.json ] || ! grep -q "docker.happyjack.cn" /etc/docker/daemon.json; then
          mkdir -p /etc/docker
          cat > /etc/docker/daemon.json << 'DOCKER_EOF'
      {
        "registry-mirrors": ["https://docker.happyjack.cn"]
      }
      DOCKER_EOF
          systemctl restart docker
          sleep 5
          echo -e "\${GREEN}✅ Docker 镜像加速器配置完成\${NC}"
        else
          echo -e "\${YELLOW}⏭️  Docker 镜像加速器已配置，跳过\${NC}"
        fi

        echo -e "\${GREEN}🐳 构建 Docker 镜像...\${NC}"
        docker compose -f $DEPLOY_COMPOSE_FILE --env-file $DEPLOY_ENV_FILE build --no-cache || {
          echo -e "\${RED}❌ Docker 镜像构建失败\${NC}"
          echo -e "\${YELLOW}🔄 回滚到上一个提交: \$PREVIOUS_COMMIT\${NC}"
          git checkout \$PREVIOUS_COMMIT
          exit 1
        }

        echo -e "\${GREEN}🔄 停止旧容器...\${NC}"
        docker compose -f $DEPLOY_COMPOSE_FILE --env-file $DEPLOY_ENV_FILE --profile $DEPLOY_PROFILE down || true

        echo -e "\${GREEN}⚙️  启动新容器...\${NC}"
        docker compose -f $DEPLOY_COMPOSE_FILE --env-file $DEPLOY_ENV_FILE --profile $DEPLOY_PROFILE up -d || {
          echo -e "\${RED}❌ 容器启动失败\${NC}"
          echo -e "\${YELLOW}🔄 回滚到上一个提交: \$PREVIOUS_COMMIT\${NC}"
          git checkout \$PREVIOUS_COMMIT
          docker compose -f $DEPLOY_COMPOSE_FILE --env-file $DEPLOY_ENV_FILE build
          docker compose -f $DEPLOY_COMPOSE_FILE --env-file $DEPLOY_ENV_FILE --profile $DEPLOY_PROFILE up -d
          exit 1
        }

        echo -e "\${GREEN}⏳ 等待容器启动...\${NC}"
        sleep 15

        echo -e "\${GREEN}🗄️  运行数据库迁移...\${NC}"
        docker compose -f $DEPLOY_COMPOSE_FILE --env-file $DEPLOY_ENV_FILE exec -T api alembic upgrade head || {
          echo -e "\${YELLOW}⚠️  数据库迁移失败或已跳过\${NC}"
        }

        echo -e "\${GREEN}🏥 健康检查...\${NC}"
        RETRY_COUNT=0
        MAX_RETRIES=$HEALTH_CHECK_RETRIES
        HEALTH_CHECK_PASSED=false

        while [ \$RETRY_COUNT -lt \$MAX_RETRIES ]; do
          if curl -f -s -o /dev/null -w "%{http_code}" $HEALTH_CHECK_URL | grep -q "200"; then
            echo -e "\${GREEN}✅ 健康检查通过 (尝试 \$((RETRY_COUNT + 1))/\$MAX_RETRIES)\${NC}"
            HEALTH_CHECK_PASSED=true
            break
          else
            RETRY_COUNT=\$((RETRY_COUNT + 1))
            echo -e "\${YELLOW}⏳ 健康检查失败，等待重试... (\$RETRY_COUNT/\$MAX_RETRIES)\${NC}"
            sleep 5
          fi
        done

        if [ "\$HEALTH_CHECK_PASSED" = false ]; then
          echo -e "\${RED}❌ 健康检查失败，开始回滚...\${NC}"
          docker compose -f $DEPLOY_COMPOSE_FILE --env-file $DEPLOY_ENV_FILE --profile $DEPLOY_PROFILE logs --tail=100 api
          
          echo -e "\${YELLOW}🔄 回滚到上一个提交: \$PREVIOUS_COMMIT\${NC}"
          git checkout \$PREVIOUS_COMMIT
          docker compose -f $DEPLOY_COMPOSE_FILE --env-file $DEPLOY_ENV_FILE build
          docker compose -f $DEPLOY_COMPOSE_FILE --env-file $DEPLOY_ENV_FILE --profile $DEPLOY_PROFILE down
          docker compose -f $DEPLOY_COMPOSE_FILE --env-file $DEPLOY_ENV_FILE --profile $DEPLOY_PROFILE up -d
          exit 1
        fi

        echo -e "\${GREEN}🧹 清理未使用的 Docker 资源...\${NC}"
        docker system prune -f --volumes || true

        echo -e "\${GREEN}✅ 测试环境部署完成\${NC}"
        echo -e "\${GREEN}📊 容器状态：\${NC}"
        docker compose -f $DEPLOY_COMPOSE_FILE --env-file $DEPLOY_ENV_FILE --profile $DEPLOY_PROFILE ps
        
        echo -e "\${GREEN}📈 资源使用情况：\${NC}"
        docker stats --no-stream --format "table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}"
      EOF
    - echo "✅ 部署成功"
  environment:
    name: testing
    url: http://$DEPLOY_HOST:8001
    on_stop: stop:testing
  only:
    - develop
  when: on_success  # 只有在所有前置任务成功后才自动部署
  tags:
    - docker

# 停止测试环境
stop:testing:
  <<: *deploy_template
  stage: deploy
  variables:
    GIT_STRATEGY: none
  script:
    - echo "🛑 停止测试环境..."
    - |
      ssh $DEPLOY_USER@$DEPLOY_HOST bash -s << EOF
        set -e
        cd $DEPLOY_PATH
        
        echo "🔄 停止容器..."
        docker compose -f $DEPLOY_COMPOSE_FILE --env-file $DEPLOY_ENV_FILE --profile $DEPLOY_PROFILE down
        
        echo "🧹 清理未使用的资源..."
        docker system prune -f
        
        echo "✅ 测试环境已停止"
      EOF
  environment:
    name: testing
    action: stop
  only:
    - develop
  when: manual
  tags:
    - docker

# ==============================================
# 触发规则说明
# ==============================================
# 触发条件:
#   - develop 分支: 完整流水线（prepare → quality → deploy）
#   - main 分支: 准备和质量检查（不自动部署）
#   - merge_requests: 准备和质量检查（不部署）
#
# 环境变量配置 (GitLab Settings → CI/CD → Variables):
#   - SSH_PRIVATE_KEY_TEST: 测试服务器 SSH 私钥 (Type: File, Protected: Yes)
#
# 部署流程:
#   1. GitLab Runner 触发部署任务
#   2. SSH 连接到测试服务器 (192.168.0.221)
#   3. 在测试服务器上拉取最新代码
#   4. 在测试服务器上构建 Docker 镜像
#   5. 停止旧容器，启动新容器
#   6. 运行数据库迁移
#   7. 健康检查（5 次重试）
#   8. 失败时自动回滚到上一个版本
#
# 测试服务器要求:
#   - 已安装 Docker 和 Docker Compose
#   - 已配置 SSH 密钥认证
#   - 项目目录: /opt/wes_backend
#   - 环境文件: /opt/wes_backend/.env.test
#   - Git 仓库已初始化并配置 origin
#
# 优化特性:
#   - 并行执行 lint 和 test 任务（提高速度）
#   - 健康检查失败自动回滚（提高可靠性）
#   - Docker 镜像加速器（加速构建）
#   - 自动清理未使用的 Docker 资源（节省空间）
#   - 详细的日志输出（便于排查问题）
#
# 注意事项:
#   - 生产环境部署需要单独配置
#   - 确保测试服务器有足够的磁盘空间
#   - 定期清理 Docker 镜像和容器

