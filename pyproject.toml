[project]
name = "wes-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.0",
    "asyncpg>=0.31.0",
    "dotenv>=0.9.9",
    "email-validator>=2.0.0",
    "fastapi>=0.128.0",
    "greenlet>=3.3.0",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "orjson>=3.11.5",
    "pwdlib[argon2]>=0.3.0",
    "psutil>=6.1.1",
    "pydantic[email]>=2.12.5",
    "pydantic-settings>=2.12.0",
    "ruff>=0.14.11",
    "sqlalchemy>=2.0.45",
    "sqlmodel>=0.0.31",
    "starlette-context>=0.4.0",
    "transitions>=0.9.3",
    "uvicorn>=0.40.0",
    "user-agents>=2.2.0",
    "xdbsearchip>=1.0.2",
    "asgiref>=3.11.0",
    "locust>=2.43.1",
    # Celery 异步任务队列（不使用 [redis] 额外，避免与项目 redis 版本冲突）
    "celery>=5.4.0",
    "flower>=2.0.1",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20.0",
    "locust>=2.33.0",
    "pytest>=8.0.0",
    "pytest-benchmark>=5.1.0",
    "pytest-asyncio>=0.26.0",
]

[tool.ruff]
# 目标 Python 版本
target-version = "py313"

# 代码行长度（FastAPI 社区推荐 88 或 100）
line-length = 120

# 扫描的文件扩展名
extend-include = ["*.py", "*.pyi", "ipynb"]

# 排除目录
extend-exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.egg-info",
    ".ruff_cache",
    "migrations",
]

[tool.ruff.lint]
# 启用的规则集
select = [
    "F",      # Pyflakes (错误检测)
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "I",      # isort (导入排序)
    "N",      # pep8-naming (命名规范)
    "UP",     # pyupgrade (现代化语法)
    "ASYNC",  # async 相关规则 (FastAPI 重要)
    "S",      # flake8-bandit (安全检查)
    "B",      # flake8-bugbear (常见错误)
    "C4",     # flake8-comprehensions
    "DTZ",    # 日期时间问题
    "T10",    # 调试代码检测
    "EXE",    # 可执行文件权限
    "ISC",    # 字符串拼接
    "ICN",    # 导入命名规范
    "G",      # logging 格式化
    "PIE",    # 杂项错误
    "PYI",    # .pyi 文件检查
    "PT",     # pytest 风格
    "Q",      # 引号规范
    "RSE",    # raise 检查
    "RET",    # 返回值检查
    "SIM",    # 简化代码
    "TID",    # 导入排序
    "TCH",    # 类型检查导入
    "INT",    # 内部代码解释
    "ARG",    # 未使用的参数
    "PTH",    # 使用 pathlib
    "PGH",    # pytest 警告
    "PL",     # Pylint 规则
    "TRY",    # 异常处理
    "FLY",    # f-string 规则
    "PERF",   # 性能优化
    "RUF",    # Ruff 特定规则
]

# 忽略的规则
ignore = [
    # 测试相关
    "S101",       # 允许使用 assert (pytest 需要)
    "PLR2004",    # 允许测试中使用魔法值
    "ARG001",     # 允许未使用的参数 (fixture 常见)
    "PT011",      # 允许 pytest.raises过于宽松

    # FastAPI/Pydantic 相关
    "B008",       # 允许函数调用作为默认参数 (FastAPI 依赖注入常见)
    "UP007",      # 保持 Optional[X] 写法 (Pydantic 兼容性)
    "ISC001",     # 与 ruff format 冲突

    # SQLAlchemy/SQLModel 相关
    "N806",       # 允许变量名包含大写字母 (SQLModel 表列名常见)
    "PLR0913",    # 允许较多参数 (模型定义常见)

    # 异步相关
    "PLR0915",    # 允许较多语句 (异步函数可能较复杂)
    "TRY003",     # 允许在异常中写长错误信息
    "TRY300",     # 允许 try-except 块中使用 else

    # 单例模式：允许合理使用全局变量
    "PLW0603",    # 允许 global 语句（数据库连接、日志等单例）

    # 合理的安全实践
    "S104",       # 允许绑定 0.0.0.0（开发环境）
    "S311",       # 允许非加密随机数（缓存抖动、测试数据）

    # 代码设计选择
    "N818",       # 允许 AppException 命名（不强制 Error 后缀）
    "S110",       # 允许 try-except-pass（合理的静默失败）
    "TRY301",     # 允许 try 块中的 raise
    "DTZ007",     # 允许 strptime 无时区（后续会添加时区）
    "ASYNC109",   # 允许 timeout 参数名（非 asyncio.wait_for）

    # 其他
    "E501",       # 行长度由 formatter 处理
    "COM812",     # 与 ruff format 冲突
    "ISC001",     # 与 ruff format 冲突
    "PYI025",     # 允许所有导出
    "G004",       # 允许 logger.info 使用 f-string

    # 项目特定：允许延迟导入以避免循环依赖
    "PLC0415",    # 允许函数内 import (register_* 模式)

    # 中文项目：允许中文全角字符
    "RUF001",     # 字符串中的全角字符
    "RUF002",     # 文档字符串中的全角字符
    "RUF003",     # 注释中的全角字符
]

# 允许自动修复的规则
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
# Pydantic Settings 类的特殊规则
"src/core/conf.py" = [
    "N802",       # 允许 @computed_field 使用大写命名 (属性常量)
    "S105",       # 允许 Redis key 前缀 (非密码)
]

# RBAC 模块的特殊规则
"src/core/rbac.py" = [
    "N802",       # 允许函数工厂使用 PascalCase (RequirePermission)
]

# 测试文件的特殊规则（宽松模式）
"tests/**/*.py" = [
    # === 测试框架相关 ===
    "S101",      # 允许 assert (pytest 需要)
    "S102",      # 允许 exec (某些测试场景)
    "S106",      # 允许硬编码密码 (测试数据)
    "S110",      # 允许 try-except-pass (测试异常处理)
    "S311",      # 允许非加密随机数 (测试数据生成)
    "S105",      # 允许硬编码密码字符串 (测试凭证)
    "ARG",       # 允许未使用的参数 (fixture 常见)
    "PT011",     # pytest.raises 宽松
    "PT",        # pytest 相关规则宽松

    # === 代码风格宽松 ===
    "PLR2004",   # 允许魔法值 (测试数据)
    "PLR0913",   # 允许较多参数 (测试函数)
    "PLR0915",   # 允许较多语句 (测试场景)
    "PLR0914",   # 允许较多返回值
    "PLR0912",   # 允许较多分支
    "PLR0911",   # 允许较多返回语句
    "PLR0916",   # 允许较多混合变量
    "PLR0917",   # 允许较多异常处理器
    "D1",        # 允许缺少 docstring

    # === 导入和定义宽松 ===
    "F401",      # 允许未使用的导入 (测试辅助函数)
    "F811",      # 允许重复导入
    "PLC0415",   # 允许函数内 import
    "TID",       # 允许相对导入

    # === 代码简化宽松 ===
    "SIM108",    # 允许 if-else 块而不是 if-exp (可读性优先)
    "SIM105",    # 允许 contextlib.suppress (测试清理)
    "SIM117",    # 允许嵌套 with 块

    # === 其他宽松 ===
    "TRY",       # 异常处理宽松
    "PERF",      # 性能规则宽松 (测试不需要优化)
    "DTZ",       # 日期时间宽松 (测试数据)
    "PTH",       # pathlib 宽松 (测试可用 os.path)
    "UP046",     # 允许旧式泛型类
    "UP047",     # 允许旧式泛型函数
]

# 脚本文件的宽松规则
"scripts/**/*.py" = [
    "T201",      # 允许 print
    "S101",      # 允许 assert
    "PLR2004",   # 允许魔法值
    "F401",      # 允许未使用的导入
]

# 数据库迁移文件
"migrations/versions/*.py" = [
    "F401",      # 未使用的导入
]

# 脚本文件
"scripts/*.py" = [
    "T201",      # 允许 print
]

[tool.ruff.lint.isort]
# 导入排序配置
known-first-party = ["src"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.pycodestyle]
# 最大文档行长度
max-doc-length = 100

[tool.ruff.lint.pydocstyle]
# 文档字符串约定
convention = "google"

[tool.ruff.lint.pylint]
# 最大参数数量 (调整以适应 FastAPI 依赖注入)
max-args = 10
# 最大分支数
max-branches = 20
# 最大返回值数量
max-returns = 8
# 最大语句数
max-statements = 80

[tool.ruff.lint.flake8-bandit]
# 安全检查：禁用某些检查（FastAPI 常见场景）
check-typed-exception = true

[tool.ruff.lint.flake8-bugbear]
# 允许 fastapi/pytest 上下文中的某些模式
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]

[tool.ruff.format]
# 格式化配置
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# 排除文件
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.egg-info",
    ".ruff_cache",
    "migrations",
]

[tool.ruff.lint.flake8-pytest-style]
# pytest 风格配置
fixture-parentheses = false
mark-parentheses = true

[tool.ruff.lint.pep8-naming]
# 命名规范配置
# 允许 FastAPI/Pydantic/SQLAlchemy 中的某些命名模式
ignore-names = [
    "^id$",        # SQLAlchemy/SQLModel 常见
    "^type$",      # Pydantic 常见
    "^filter$",    # SQLAlchemy filter 方法
]

classmethod-decorators = [
    "classmethod",
    "pydantic.validator",
    "pydantic.root_validator",
]

staticmethod-decorators = [
    "staticmethod",
]

[tool.pytest.ini_options]
# pytest 配置
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
norecursedirs = [
    "tests/e2e",
    "tests/resilience",
    "tests/load",
    "tests/mock",
]
markers = [
    "live: requires running external services or seeded live environment",
    "e2e: end-to-end multi-service workflow tests",
    "manual: requires explicit operator interaction or interactive terminal",
]

# 测试报告配置
# 使用方式：pytest --html=reports/report.html --self-contained-html --cov=src --cov-report=html:reports/coverage --cov-report=term-missing
addopts = [
    # 更详细的输出
    "-v",
    # 显示最慢的 10 个测试
    "--durations=10",
    # 简短的错误信息
    "--tb=short",
    # 显示打印输出
    "-s",
    # 自动生成覆盖率报告（如果使用了 --cov 参数）
    "--cov-report=term-missing",
]

[dependency-groups]
dev = [
    "bandit>=1.9.3",
    "pytest-cov>=7.0.0",
    "pytest-html>=4.2.0",
    "basedpyright>=1.28.0",
    "pytest-asyncio>=1.3.0",
    "aiosqlite>=0.22.1",
]

[tool.basedpyright]
# 基于 pyright 的类型检查器配置
# 本地只想看 error/warning 时，使用 `scripts/basedpyright-local.sh`
# 原则：
# - warning 只保留高信号、可能代表真实缺陷的问题
# - untyped 三方库与样板卫生问题以下沉为主，避免稀释信号
# - Unknown 信息继续保留为 information，作为持续收敛的技术债雷达
# 目标 Python 版本
pythonVersion = "3.13"

# 类型检查模式
# "off": 关闭类型检查
# "basic": 基本类型检查
# "standard": 标准类型检查 (推荐用于生产项目)
# "strict": 严格类型检查
typeCheckingMode = "standard"

# 分析报告配置
reportMissingImports = "error"
reportMissingTypeStubs = "hint"
reportUndefinedVariable = "error"
reportUnknownMemberType = "information"
reportUnknownVariableType = "information"
reportUnknownArgumentType = "information"
reportUnknownParameterType = "information"
reportInvalidTypeArguments = "error"
reportPrivateImportUsage = "hint"
reportUnusedCallResult = "warning"
reportUnusedVariable = "hint"
reportUnusedImport = "hint"
reportUnusedClass = "hint"
reportUnusedFunction = "hint"

# Pydantic 特殊支持
reportCallInDefaultInitializer = "hint"
reportUnnecessaryComparison = "warning"

# 对动态且缺少高质量类型信息的三方库降噪
allowedUntypedLibraries = [
    "celery",
    "user_agents",
    "XdbSearchIP",
]

# 仅对高风险边界模块启用局部 strict，避免把低收益样板代码一起拉进高成本治理
strict = [
    "src/core/security.py",
    "src/core/api_security.py",
    "src/database/redis_client.py",
]

# 排除目录
exclude = [
    ".git",
    ".venv",
    ".claude",
    "__pycache__",
    "*.egg-info",
    ".pytest_cache",
    ".ruff_cache",
    ".mypy_cache",
    "backups",
    "claudedocs",
    "migrations",
    "node_modules",
    "scripts",
    "tests",
    "dist",
    "build",
]

# 包含的额外路径
extraPaths = ["src"]
