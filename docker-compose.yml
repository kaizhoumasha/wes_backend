# ============================================
# Docker Compose - 统一配置文件
# ============================================
# 用途: 通过 profiles 和环境变量控制部署的服务
#
# 使用方法:
#   开发环境:   docker compose --profile dev up -d
#   测试环境:   docker compose --profile test up -d
#   开发/E2E/SMT Mock: docker compose --profile dev up -d 或 --profile e2e/smt up -d
#   生产环境:   docker-compose --profile prod up -d
#   仅 Celery:  docker-compose --profile celery up -d
#   仅 API:     docker-compose --profile api up -d
#   基础设施:  docker-compose --profile infra up -d
#   前端联调:   docker compose -f docker-compose.yml -f docker-compose.frontend.yml --profile dev up -d
#   前端测试:   docker compose -f docker-compose.yml -f docker-compose.frontend.yml --profile test up -d
#
# 环境配置:
#   开发: 使用 .env 或 .env.dev
#   测试: 使用 .env.test
#   生产: 使用 .env.prod
# ============================================

x-no-localhost-proxy: &no-localhost-proxy
  HTTP_PROXY: ""
  HTTPS_PROXY: ""
  http_proxy: ""
  https_proxy: ""

x-no-localhost-proxy-build-args: &no-localhost-proxy-build-args
  HTTP_PROXY: ""
  HTTPS_PROXY: ""
  http_proxy: ""
  https_proxy: ""

x-external-http-credentials: &external-http-credentials
  WMS_QUERY_IN_PROCESS_SIMULATION_ENABLED: ${WMS_QUERY_IN_PROCESS_SIMULATION_ENABLED:-false}
  WMS_MATERIAL_FLOW_SANDBOX_HMAC_SECRET_V1: ${WMS_MATERIAL_FLOW_SANDBOX_HMAC_SECRET_V1:-}
  WMS_MATERIAL_FLOW_STAGING_HMAC_SECRET_V1: ${WMS_MATERIAL_FLOW_STAGING_HMAC_SECRET_V1:-}
  WMS_MATERIAL_FLOW_PRODUCTION_HMAC_SECRET_V1: ${WMS_MATERIAL_FLOW_PRODUCTION_HMAC_SECRET_V1:-}
  WMS_MATERIAL_FLOW_SANDBOX_HMAC_SECRET_V2: ${WMS_MATERIAL_FLOW_SANDBOX_HMAC_SECRET_V2:-}
  WMS_MATERIAL_FLOW_STAGING_HMAC_SECRET_V2: ${WMS_MATERIAL_FLOW_STAGING_HMAC_SECRET_V2:-}
  WMS_MATERIAL_FLOW_PRODUCTION_HMAC_SECRET_V2: ${WMS_MATERIAL_FLOW_PRODUCTION_HMAC_SECRET_V2:-}
  WES_REVOKED_EXTERNAL_HTTP_CREDENTIAL_REFERENCES: ${WES_REVOKED_EXTERNAL_HTTP_CREDENTIAL_REFERENCES:-}

x-wms-effect-status-config: &wms-effect-status-config
  WMS_PROVIDER_PROFILE_FILE: ${WMS_PROVIDER_PROFILE_FILE:-}
  WMS_EFFECT_STATUS_TIMEOUT_SECONDS: ${WMS_EFFECT_STATUS_TIMEOUT_SECONDS}
  WMS_EFFECT_STATUS_MAX_RESPONSE_BYTES: ${WMS_EFFECT_STATUS_MAX_RESPONSE_BYTES}
  WMS_EFFECT_IDEMPOTENCY_RETENTION_SECONDS: ${WMS_EFFECT_IDEMPOTENCY_RETENTION_SECONDS}
  WMS_EFFECT_STATUS_VISIBILITY_SLA_SECONDS: ${WMS_EFFECT_STATUS_VISIBILITY_SLA_SECONDS}
  WES_EFFECT_MAX_CONFIRMATION_AGE_SECONDS: ${WES_EFFECT_MAX_CONFIRMATION_AGE_SECONDS}
  WES_EFFECT_NOT_FOUND_GRACE_SECONDS: ${WES_EFFECT_NOT_FOUND_GRACE_SECONDS}
  WES_EFFECT_STATUS_SAFETY_MARGIN_SECONDS: ${WES_EFFECT_STATUS_SAFETY_MARGIN_SECONDS}
  WES_EFFECT_STATUS_SCAN_BATCH_SIZE: ${WES_EFFECT_STATUS_SCAN_BATCH_SIZE}
  WES_EFFECT_STATUS_CLAIM_LEASE_SECONDS: ${WES_EFFECT_STATUS_CLAIM_LEASE_SECONDS}
  WES_EFFECT_STATUS_MAX_QUERY_ATTEMPTS: ${WES_EFFECT_STATUS_MAX_QUERY_ATTEMPTS}
  WES_EFFECT_STATUS_INITIAL_BACKOFF_SECONDS: ${WES_EFFECT_STATUS_INITIAL_BACKOFF_SECONDS}
  WES_EFFECT_STATUS_MAX_BACKOFF_SECONDS: ${WES_EFFECT_STATUS_MAX_BACKOFF_SECONDS}

services:
  # ============================================
  # FastAPI 应用服务
  # ============================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-production}
      args: *no-localhost-proxy-build-args
    image: wes-backend:${ENV:-prod}
    container_name: wes_api_${ENV:-prod}
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "${DOCKER_HOST_BIND_IP:-127.0.0.1}:${APP_HOST_PORT:-8001}:8001"
    env_file:
      - ${BACKEND_ENV_FILE:-.env}
    environment:
      <<: [*no-localhost-proxy, *external-http-credentials, *wms-effect-status-config]
      # 应用配置
      APP_HOST: 0.0.0.0
      APP_PORT: 8001

      # 数据库配置 ${POSTGRES_HOST}
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DATABASE_RUNTIME_ROLE: api
      DATABASE_POOL_SIZE: 5
      DATABASE_MAX_OVERFLOW: 0
      DATABASE_POOL_TIMEOUT: 30
      DATABASE_APPLICATION_NAME: ${ENV:-prod}

      # Redis 配置 ${REDIS_HOST}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      # Celery 配置（使用服务名而非变量，确保容器内正确解析）
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT}/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT}/2

      # 日志配置
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON_OUTPUT: ${LOG_JSON_OUTPUT:-true}
    volumes:
      # 开发环境挂载源码
      - ${SOURCE_MOUNT:-./src}:/app/src:rw
      # 日志目录
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wesp9-network
    deploy:
      replicas: ${API_REPLICAS:-1}
      resources:
        limits:
          cpus: ${API_CPU_LIMIT:-2.0}
          memory: ${API_MEMORY_LIMIT:-2G}
        reservations:
          cpus: ${API_CPU_RESERVATION:-0.5}
          memory: ${API_MEMORY_RESERVATION:-512M}
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILES:-3}"
    profiles:
      - dev
      - test
      - e2e
      - prod
      - api

  # ============================================
  # Celery Worker - 异步任务处理
  # ============================================
  celery:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-production}
      args: *no-localhost-proxy-build-args
    image: wes-backend:${ENV:-prod}
    restart: ${RESTART_POLICY:-unless-stopped}
    command: >
      sh -c '
      if [ "${ENV:-prod}" = "dev" ]; then
        exec sh /app/src/celery_app/dev_worker_autoreload.sh;
      else
        exec celery -A src.celery_app.app worker --loglevel=${CELERY_LOG_LEVEL:-INFO} --concurrency=${CELERY_CONCURRENCY:-4} --max-tasks-per-child=${CELERY_MAX_TASKS:-1000} --queues=${CELERY_WORKER_QUEUES:-default,celery,device};
      fi
      '
    env_file:
      - ${BACKEND_ENV_FILE:-.env}
    environment:
      <<: [*no-localhost-proxy, *external-http-credentials, *wms-effect-status-config]
      # 数据库配置
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DATABASE_RUNTIME_ROLE: celery
      DATABASE_POOL_SIZE: 1
      DATABASE_MAX_OVERFLOW: 0
      DATABASE_POOL_TIMEOUT: 30
      DATABASE_APPLICATION_NAME: ${ENV:-prod}

      # Redis 配置（容器内使用 docker 服务名）
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      # Celery 配置
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT}/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT}/2
      CELERY_WORKER_QUEUES: default,celery,device
      WMS_PROVIDER_PROCESS_ROLE: wes

      # 日志配置
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON_OUTPUT: ${LOG_JSON_OUTPUT:-true}
    volumes:
      # 开发环境挂载源码
      - ${SOURCE_MOUNT:-./src}:/app/src:rw
      # 日志目录
      - ./logs:/app/logs
    healthcheck:
      # 检查 worker 进程本身，避免 Celery remote-control ping 在热重载/控制面抖动时误报 unhealthy。
      test: ["CMD", "python", "/app/src/celery_app/worker_healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wesp9-network
    stop_grace_period: 30s
    deploy:
      replicas: ${CELERY_WORKER_REPLICAS:-2}
      resources:
        limits:
          cpus: ${CELERY_CPU_LIMIT:-2.0}
          memory: ${CELERY_MEMORY_LIMIT:-2G}
        reservations:
          cpus: ${CELERY_CPU_RESERVATION:-0.5}
          memory: ${CELERY_MEMORY_RESERVATION:-512M}
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILES:-3}"
    profiles:
      - dev
      - test
      - e2e
      - prod
      - celery

  # ============================================
  # Celery WMS Fulfillment Worker - 专用实际 lane
  # ============================================
  celery-wms-fulfillment:
    extends:
      service: celery
    command: >
      celery -A src.celery_app.app worker
      --loglevel=${CELERY_LOG_LEVEL:-INFO}
      --concurrency=${CELERY_CONCURRENCY:-4}
      --max-tasks-per-child=${CELERY_MAX_TASKS:-1000}
      --queues=wms-fulfillment
    environment:
      CELERY_WORKER_QUEUES: wms-fulfillment
      WMS_PROVIDER_PROCESS_ROLE: fulfillment
    deploy:
      replicas: ${WMS_FULFILLMENT_CELERY_REPLICAS:-1}

  # ============================================
  # Celery Beat - 定时任务调度
  # ============================================
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-production}
      args: *no-localhost-proxy-build-args
    image: wes-backend:${ENV:-prod}
    container_name: wes_celery_beat_${ENV:-prod}
    restart: ${RESTART_POLICY:-unless-stopped}
    command: >
      sh -c '
      if [ "${ENV:-prod}" = "dev" ]; then
        exec sh /app/src/celery_app/dev_beat_autoreload.sh;
      else
        exec celery -A src.celery_app.app beat --loglevel=${CELERY_LOG_LEVEL:-INFO};
      fi
      '
    env_file:
      - ${BACKEND_ENV_FILE:-.env}
    environment:
      <<: [*no-localhost-proxy, *external-http-credentials, *wms-effect-status-config]
      DATABASE_RUNTIME_ROLE: cli
      DATABASE_POOL_SIZE: 1
      DATABASE_MAX_OVERFLOW: 0
      # Redis 配置（容器内使用 docker 服务名）
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      # Celery 配置
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT}/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT}/2

      # 日志配置
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON_OUTPUT: ${LOG_JSON_OUTPUT:-true}
    volumes:
      # 源码目录（开发环境热重载）
      - ./src:/app/src:rw
      # 日志目录
      - ./logs:/app/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "tr '\\000' ' ' </proc/1/cmdline | grep -q 'celery.*beat' || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - wesp9-network
    deploy:
      resources:
        limits:
          cpus: ${CELERY_CPU_LIMIT:-0.5}
          memory: ${CELERY_MEMORY_LIMIT:-512M}
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILES:-3}"
    profiles:
      - dev
      - prod
      - celery

  # ============================================
  # Flower - Celery 监控
  # ============================================
  flower:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-production}
      args: *no-localhost-proxy-build-args
    image: wes-backend:${ENV:-prod}
    container_name: wes_flower_${ENV:-prod}
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "${DOCKER_HOST_BIND_IP:-127.0.0.1}:${FLOWER_PORT:-5555}:5555"
    command: >
      celery -A src.celery_app.app flower
      --port=5555
      --broker=redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT}/1
      --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-changeme}
    env_file:
      - ${BACKEND_ENV_FILE:-.env}
    environment:
      <<: *no-localhost-proxy
      DATABASE_RUNTIME_ROLE: cli
      DATABASE_POOL_SIZE: 1
      DATABASE_MAX_OVERFLOW: 0
      # Redis 配置（容器内使用 docker 服务名）
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      # Celery 配置
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT}/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT}/2
    volumes:
      # 源码目录（开发环境热重载）
      - ./src:/app/src:rw
      # 日志目录
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - wesp9-network
    deploy:
      resources:
        limits:
          cpus: ${FLOWER_CPU_LIMIT:-0.25}
          memory: ${FLOWER_MEMORY_LIMIT:-256M}
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILES:-3}"
    profiles:
      - dev
      - prod
      - celery

  # ============================================
  # Nginx 反向代理
  # ============================================
  nginx:
    image: nginx:1.27-alpine
    container_name: wes_nginx_${ENV:-prod}
    restart: ${RESTART_POLICY:-unless-stopped}
    environment: *no-localhost-proxy
    ports:
      - "${DOCKER_HOST_BIND_IP:-127.0.0.1}:${NGINX_HTTP_PORT:-80}:80"
      - "${DOCKER_HOST_BIND_IP:-127.0.0.1}:${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      # Nginx 配置
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # SSL 证书
      - ${NGINX_SSL_DIR:-./nginx/ssl}:/etc/nginx/ssl:ro
      # 日志
      - ./logs/nginx:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy
    networks:
      - wesp9-network
    deploy:
      resources:
        limits:
          cpus: ${NGINX_CPU_LIMIT:-0.5}
          memory: ${NGINX_MEMORY_LIMIT:-256M}
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILES:-3}"
    profiles:
      - prod
      - api
      - dev
      - test

  # ============================================
  # Pytest - 自动化测试
  # ============================================
  pytest:
    build:
      context: .
      dockerfile: Dockerfile
      target: testing
      args: *no-localhost-proxy-build-args
    image: wes-backend:${ENV:-test}
    container_name: wes_pytest_${ENV:-test}
    restart: "no"
    command: >
      sh -c "
        if [ -z \"$${DATABASE_APPLICATION_RUN_ID}\" ]; then
          export DATABASE_APPLICATION_RUN_ID=\"integration-$$(date +%s)-$$$$\";
        fi &&
        echo '等待数据库就绪...' &&
        sleep ${DB_WAIT_TIME:-5} &&
        echo '运行数据库迁移...' &&
        alembic upgrade head &&
        echo '运行测试...' &&
        pytest -v --cov=src --cov-report=html:reports/coverage --cov-report=term-missing --html=reports/test/report.html --self-contained-html &&
        echo '测试完成!'
      "
    environment:
      <<: *no-localhost-proxy
      DATABASE_RUNTIME_ROLE: integration
      DATABASE_POOL_SIZE: 1
      DATABASE_MAX_OVERFLOW: 0
      DATABASE_APPLICATION_NAME: ${ENV:-test}
      # 外部可显式指定 run-id；直接启动 test profile 时由 command 为本次容器生成唯一值。
      DATABASE_APPLICATION_RUN_ID: ${INTEGRATION_RUN_ID:-}
      # 数据库配置
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}_test

      # Redis 配置
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      # 测试报告
      - ./reports:/app/reports
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wesp9-network
    profiles:
      - test

  # ============================================
  # Locust - 性能测试
  # ============================================
  locust:
    build:
      context: .
      dockerfile: Dockerfile
      target: testing
      args: *no-localhost-proxy-build-args
    image: wes-backend:${ENV:-test}
    container_name: wes_locust_${ENV:-test}
    restart: "no"
    environment: *no-localhost-proxy
    ports:
      - "${DOCKER_HOST_BIND_IP:-127.0.0.1}:${LOCUST_PORT:-8089}:8089"
    command: locust -f /app/locustfiles/locustfile.py --host=${LOCUST_TARGET_HOST:-http://api:8001} --html=${LOCUST_REPORT_PATH:-reports/locust/report.html}
    volumes:
      # 测试脚本和报告
      - ./locustfiles:/app/locustfiles
      - ./reports:/app/reports
    depends_on:
      - api
    networks:
      - wesp9-network
    profiles:
      - test

  # ============================================
  # PostgreSQL - TimescaleDB
  # ============================================
  db:
    image: timescale/timescaledb:latest-pg17
    container_name: wes_postgres_${ENV:-prod}
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      <<: *no-localhost-proxy
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # 性能优化
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    ports:
      - "${DOCKER_HOST_BIND_IP:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - ./docker_data/postgres_${ENV:-prod}:/var/lib/postgresql/data
      # PostgreSQL 日志基线配置（供各环境配置 include）
      - ./postgresql/base.conf:/etc/postgresql/base.conf:ro
      # PostgreSQL 配置
      - ${POSTGRES_CONFIG_FILE:-./postgresql/postgresql.conf}:/etc/postgresql/postgresql.conf:ro
      # 备份目录
      - ${BACKUP_DIR:-./backups}:/backups
    command: ${POSTGRES_COMMAND:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wesp9-network
    deploy:
      resources:
        limits:
          cpus: ${POSTGRES_CPU_LIMIT:-2.0}
          memory: ${POSTGRES_MEMORY_LIMIT:-4G}
        reservations:
          cpus: ${POSTGRES_CPU_RESERVATION:-0.5}
          memory: ${POSTGRES_MEMORY_RESERVATION:-1G}
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILES:-3}"
    profiles:
      - infra
      - dev
      - test
      - e2e
      - prod
      - celery
      - api

  # ============================================
  # Redis
  # ============================================
  redis:
    image: redis:8-alpine
    container_name: wes_redis_${ENV:-prod}
    restart: ${RESTART_POLICY:-unless-stopped}
    environment: *no-localhost-proxy
    ports:
      - "${DOCKER_HOST_BIND_IP:-127.0.0.1}:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - ./docker_data/redis_${ENV:-prod}:/data
      # Redis 基线配置（供各环境配置 include）
      - ./redis/base.conf:/usr/local/etc/redis/base.conf:ro
      # Redis 配置
      - ${REDIS_CONFIG_FILE:-./redis/redis.conf}:/usr/local/etc/redis/redis.conf:ro
    command: ${REDIS_COMMAND:-redis-server /usr/local/etc/redis/redis.conf} --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wesp9-network
    deploy:
      resources:
        limits:
          cpus: ${REDIS_CPU_LIMIT:-1.0}
          memory: ${REDIS_MEMORY_LIMIT:-2G}
        reservations:
          cpus: ${REDIS_CPU_RESERVATION:-0.25}
          memory: ${REDIS_MEMORY_RESERVATION:-512M}
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILES:-3}"
    profiles:
      - infra
      - dev
      - test
      - e2e
      - prod
      - celery
      - api

  # ============================================
  # ECS Mock 服务 - 单服务多设备模拟
  # 注意：本机 dev profile 需要启动设备 Mock，供 WorkLine 设备命令联调使用。
  # ============================================
  mock_ecs:
    build:
      context: .
      dockerfile: tests/mock/Dockerfile
      args: *no-localhost-proxy-build-args
    image: wes-mock:ecs
    container_name: wes_mock_ecs_${ENV:-test}
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "${DOCKER_HOST_BIND_IP:-127.0.0.1}:${MOCK_ECS_PORT:-8010}:8010"
    working_dir: /app/tests/mock
    command: >
      python -m uvicorn
      ecs_mock_server:app
      --host 0.0.0.0
      --port 8010
      --log-level info
      --reload
    volumes:
      - ./tests/mock:/app/tests/mock:rw
    environment:
      <<: *no-localhost-proxy
      MOCK_ECS_HOST: ${MOCK_ECS_HOST:-mock_ecs}
      MOCK_ECS_PORT: ${MOCK_ECS_PORT:-8010}
      WES_EVENT_CALLBACK_URL: ${CONTAINER_WES_EVENT_CALLBACK_URL:-http://api:8001/api/v1/callback/event}
      WES_RESULT_CALLBACK_URL: ${CONTAINER_WES_RESULT_CALLBACK_URL:-http://api:8001/api/v1/callback/result}
      API_APP_ID: ${API_APP_ID:-app_local_mock}
      API_APP_SECRET: ${API_APP_SECRET:-local_mock_change_me}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/api/v1/device/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - wesp9-network
    deploy:
      resources:
        limits:
          cpus: ${MOCK_CPU_LIMIT:-0.25}
          memory: ${MOCK_MEMORY_LIMIT:-128M}
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILES:-3}"
    profiles:
      - dev
      - test
      - e2e
      - smt

  # ============================================
  # WMS Mock 服务 - 模拟上位系统主数据
  # 注意：本机通用 test profile 不启动 WMS Mock；开发/E2E/SMT 联调场景显式启用。
  # ============================================
  mock_wms:
    build:
      context: .
      dockerfile: tests/mock/Dockerfile
      args: *no-localhost-proxy-build-args
    image: wes-mock:wms
    container_name: wes_mock_wms_${ENV:-test}
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "${DOCKER_HOST_BIND_IP:-127.0.0.1}:${MOCK_WMS_PORT:-8011}:8011"
    working_dir: /app/tests/mock
    command: >
      python -m uvicorn
      wms_mock_server:app
      --host 0.0.0.0
      --port 8011
      --log-level info
      --no-access-log
      --reload
    volumes:
      - ./tests/mock:/app/tests/mock:rw
    environment:
      <<: *no-localhost-proxy
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WES_EXTERNAL_CALLBACK_URL: ${CONTAINER_WES_EXTERNAL_CALLBACK_URL:-http://api:8001/api/v1/callback/external}
      API_APP_ID: ${API_APP_ID:-app_local_mock}
      API_APP_SECRET: ${API_APP_SECRET:-local_mock_change_me}
      WMS_MATERIAL_FLOW_SANDBOX_HMAC_SECRET_V1: ${WMS_MATERIAL_FLOW_SANDBOX_HMAC_SECRET_V1:-}
      WMS_MATERIAL_FLOW_SANDBOX_HMAC_SECRET_V2: ${WMS_MATERIAL_FLOW_SANDBOX_HMAC_SECRET_V2:-}
      WMS_EFFECT_IDEMPOTENCY_RETENTION_SECONDS: ${WMS_EFFECT_IDEMPOTENCY_RETENTION_SECONDS}
      WMS_EFFECT_STATUS_VISIBILITY_SLA_SECONDS: ${WMS_EFFECT_STATUS_VISIBILITY_SLA_SECONDS}
      WMS_EFFECT_STATUS_MAX_RESPONSE_BYTES: ${WMS_EFFECT_STATUS_MAX_RESPONSE_BYTES}
      WMS_EFFECT_SUBMIT_TIMEOUT_SECONDS: ${WMS_EFFECT_SUBMIT_TIMEOUT_SECONDS}
      WMS_EFFECT_STATUS_TIMEOUT_SECONDS: ${WMS_EFFECT_STATUS_TIMEOUT_SECONDS}
      MOCK_WMS_CELL_CAPACITY_DEPTH_MM: ${MOCK_WMS_CELL_CAPACITY_DEPTH_MM:-50}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8011/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - wesp9-network
    deploy:
      resources:
        limits:
          cpus: ${MOCK_CPU_LIMIT:-0.25}
          memory: ${MOCK_MEMORY_LIMIT:-128M}
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILES:-3}"
    profiles:
      - dev
      - e2e
      - smt

# ============================================
# 网络配置
# ============================================
networks:
  wesp9-network:
    name: wesp9-${ENV:-prod}-network
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: wes_br_${ENV:-prod}
