# ============================================
# Docker Compose - 统一配置文件
# ============================================
# 用途: 通过 profiles 和环境变量控制部署的服务
#
# 使用方法:
#   开发环境:   docker compose --profile dev up -d
#   测试环境:   docker compose --profile test up -d
#   生产环境:   docker-compose --profile prod up -d
#   仅 Celery:  docker-compose --profile celery up -d
#   仅 API:     docker-compose --profile api up -d
#   基础设施:  docker-compose --profile infra up -d
#   前端联调:   docker compose -f docker-compose.yml -f docker-compose.frontend.yml --profile dev up -d
#   前端测试:   docker compose -f docker-compose.yml -f docker-compose.frontend.yml --profile test up -d
#
# 环境配置:
#   开发: 使用 .env 或 .env.dev
#   测试: 使用 .env.test
#   生产: 使用 .env.prod
# ============================================

services:
  # ============================================
  # FastAPI 应用服务
  # ============================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-production}
    image: wes-backend:${ENV:-prod}
    container_name: wes_api_${ENV:-prod}
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "${APP_HOST_PORT:-8001}:8001"
    env_file:
      - .env
    environment:
      # 应用配置
      APP_HOST: 0.0.0.0
      APP_PORT: 8001

      # 数据库配置 ${POSTGRES_HOST}
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

      # Redis 配置 ${REDIS_HOST}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      # Celery 配置（使用服务名而非变量，确保容器内正确解析）
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT}/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT}/2

      # 日志配置
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON_OUTPUT: ${LOG_JSON_OUTPUT:-true}
    volumes:
      # 开发环境挂载源码
      - ${SOURCE_MOUNT:-./src}:/app/src:rw
      # 日志目录
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v1/performance/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wesp9-network
    deploy:
      replicas: ${API_REPLICAS:-1}
      resources:
        limits:
          cpus: ${API_CPU_LIMIT:-2.0}
          memory: ${API_MEMORY_LIMIT:-2G}
        reservations:
          cpus: ${API_CPU_RESERVATION:-0.5}
          memory: ${API_MEMORY_RESERVATION:-512M}
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILES:-3}"
    profiles:
      - dev
      - test
      - prod
      - api

  # ============================================
  # Celery Worker - 异步任务处理
  # ============================================
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-production}
    image: wes-backend:${ENV:-prod}
    restart: ${RESTART_POLICY:-unless-stopped}
    command: >
      sh -c '
      if [ "${ENV:-prod}" = "dev" ]; then
        exec sh /app/src/celery_app/dev_worker_autoreload.sh;
      else
        exec celery -A src.celery_app.app worker --loglevel=${CELERY_LOG_LEVEL:-INFO} --concurrency=${CELERY_CONCURRENCY:-4} --max-tasks-per-child=${CELERY_MAX_TASKS:-1000} --queues=default,celery,device;
      fi
      '
    env_file:
      - .env
    environment:
      # 数据库配置
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

      # Redis 配置（容器内使用 docker 服务名）
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      # Celery 配置
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT}/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT}/2

      # 日志配置
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON_OUTPUT: ${LOG_JSON_OUTPUT:-true}
    volumes:
      # 开发环境挂载源码
      - ${SOURCE_MOUNT:-./src}:/app/src:rw
      # 日志目录
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "celery -A src.celery_app.app inspect ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wesp9-network
    deploy:
      replicas: ${CELERY_WORKER_REPLICAS:-2}
      resources:
        limits:
          cpus: ${CELERY_CPU_LIMIT:-2.0}
          memory: ${CELERY_MEMORY_LIMIT:-2G}
        reservations:
          cpus: ${CELERY_CPU_RESERVATION:-0.5}
          memory: ${CELERY_MEMORY_RESERVATION:-512M}
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILES:-3}"
    profiles:
      - dev
      - test
      - prod
      - celery

  # ============================================
  # Celery Beat - 定时任务调度
  # ============================================
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-production}
    image: wes-backend:${ENV:-prod}
    container_name: wes_celery_beat_${ENV:-prod}
    restart: ${RESTART_POLICY:-unless-stopped}
    command: celery -A src.celery_app.app beat --loglevel=${CELERY_LOG_LEVEL:-INFO}
    env_file:
      - .env
    environment:
      # Redis 配置（容器内使用 docker 服务名）
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      # Celery 配置
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT}/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT}/2

      # 日志配置
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON_OUTPUT: ${LOG_JSON_OUTPUT:-true}
    volumes:
      # 源码目录（开发环境热重载）
      - ./src:/app/src:rw
      # 日志目录
      - ./logs:/app/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "tr '\\000' ' ' </proc/1/cmdline | grep -q 'celery.*beat' || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - wesp9-network
    deploy:
      resources:
        limits:
          cpus: ${CELERY_CPU_LIMIT:-0.5}
          memory: ${CELERY_MEMORY_LIMIT:-512M}
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILES:-3}"
    profiles:
      - dev
      - prod
      - celery

  # ============================================
  # Flower - Celery 监控
  # ============================================
  flower:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-production}
    image: wes-backend:${ENV:-prod}
    container_name: wes_flower_${ENV:-prod}
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    command: >
      celery -A src.celery_app.app flower
      --port=5555
      --broker=redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT}/1
      --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-changeme}
    env_file:
      - .env
    environment:
      # Redis 配置（容器内使用 docker 服务名）
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      # Celery 配置
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT}/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT}/2
    volumes:
      # 源码目录（开发环境热重载）
      - ./src:/app/src:rw
      # 日志目录
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - wesp9-network
    deploy:
      resources:
        limits:
          cpus: ${FLOWER_CPU_LIMIT:-0.25}
          memory: ${FLOWER_MEMORY_LIMIT:-256M}
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILES:-3}"
    profiles:
      - dev
      - prod
      - celery

  # ============================================
  # Nginx 反向代理
  # ============================================
  nginx:
    image: nginx:1.27-alpine
    container_name: wes_nginx_${ENV:-prod}
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      # Nginx 配置
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # SSL 证书
      - ${NGINX_SSL_DIR:-./nginx/ssl}:/etc/nginx/ssl:ro
      # 日志
      - ./logs/nginx:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy
      # 开发/测试模式下依赖前端服务
      frontend:
        condition: service_healthy
        required: false
    networks:
      - wesp9-network
    deploy:
      resources:
        limits:
          cpus: ${NGINX_CPU_LIMIT:-0.5}
          memory: ${NGINX_MEMORY_LIMIT:-256M}
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILES:-3}"
    profiles:
      - prod
      - api
      - dev
      - test

  # ============================================
  # Pytest - 自动化测试
  # ============================================
  pytest:
    build:
      context: .
      dockerfile: Dockerfile
      target: testing
    image: wes-backend:${ENV:-test}
    container_name: wes_pytest_${ENV:-test}
    restart: "no"
    command: >
      sh -c "
        echo '等待数据库就绪...' &&
        sleep ${DB_WAIT_TIME:-5} &&
        echo '运行数据库迁移...' &&
        alembic upgrade head &&
        echo '运行测试...' &&
        pytest -v --cov=src --cov-report=html:reports/coverage --cov-report=term-missing --html=reports/test/report.html --self-contained-html &&
        echo '测试完成!'
      "
    environment:
      # 数据库配置
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}_test

      # Redis 配置
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      # 测试报告
      - ./reports:/app/reports
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wesp9-network
    profiles:
      - test

  # ============================================
  # Locust - 性能测试
  # ============================================
  locust:
    build:
      context: .
      dockerfile: Dockerfile
      target: testing
    image: wes-backend:${ENV:-test}
    container_name: wes_locust_${ENV:-test}
    restart: "no"
    ports:
      - "${LOCUST_PORT:-8089}:8089"
    command: locust -f /app/locustfiles/locustfile.py --host=${LOCUST_TARGET_HOST:-http://api:8001} --html=${LOCUST_REPORT_PATH:-reports/locust/report.html}
    volumes:
      # 测试脚本和报告
      - ./locustfiles:/app/locustfiles
      - ./reports:/app/reports
    depends_on:
      - api
    networks:
      - wesp9-network
    profiles:
      - test

  # ============================================
  # PostgreSQL - TimescaleDB
  # ============================================
  db:
    image: timescale/timescaledb:latest-pg17
    container_name: wes_postgres_${ENV:-prod}
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # 性能优化
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - ./docker_data/postgres_${ENV:-prod}:/var/lib/postgresql/data
      # PostgreSQL 配置
      - ${POSTGRES_CONFIG_FILE:-./postgresql/postgresql.conf}:/etc/postgresql/postgresql.conf:ro
      # 备份目录
      - ${BACKUP_DIR:-./backups}:/backups
    command: ${POSTGRES_COMMAND:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wesp9-network
    deploy:
      resources:
        limits:
          cpus: ${POSTGRES_CPU_LIMIT:-2.0}
          memory: ${POSTGRES_MEMORY_LIMIT:-4G}
        reservations:
          cpus: ${POSTGRES_CPU_RESERVATION:-0.5}
          memory: ${POSTGRES_MEMORY_RESERVATION:-1G}
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILES:-3}"
    profiles:
      - infra
      - dev
      - test
      - prod
      - celery
      - api

  # ============================================
  # Redis
  # ============================================
  redis:
    image: redis:8-alpine
    container_name: wes_redis_${ENV:-prod}
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - ./docker_data/redis_${ENV:-prod}:/data
      # Redis 配置
      - ${REDIS_CONFIG_FILE:-./redis/redis.conf}:/usr/local/etc/redis/redis.conf:ro
    command: ${REDIS_COMMAND:-redis-server /usr/local/etc/redis/redis.conf} --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wesp9-network
    deploy:
      resources:
        limits:
          cpus: ${REDIS_CPU_LIMIT:-1.0}
          memory: ${REDIS_MEMORY_LIMIT:-2G}
        reservations:
          cpus: ${REDIS_CPU_RESERVATION:-0.25}
          memory: ${REDIS_MEMORY_RESERVATION:-512M}
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILES:-3}"
    profiles:
      - infra
      - dev
      - test
      - prod
      - celery
      - api

  # ============================================
  # Mock 服务 - 摄像头设备模拟
  # ============================================
  mock_camera:
    build:
      context: .
      dockerfile: tests/mock/Dockerfile
    image: wes-mock:camera
    container_name: wes_mock_camera_${ENV:-test}
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "${MOCK_CAMERA_PORT:-8003}:8003"
    working_dir: /app/tests/mock
    command: >
      python -m uvicorn
      camera_mock_server:app
      --host 0.0.0.0
      --port 8003
      --log-level info
      --reload
    volumes:
      # 开发环境挂载 mock 服务源码（支持热更新）
      - ./tests/mock:/app/tests/mock:rw
    environment:
      # 服务配置
      APP_HOST: 0.0.0.0
      APP_PORT: 8003
      # WES 事件回调地址（使用 host.docker.internal 访问主机 API）
      WES_EVENT_CALLBACK_URL: ${WES_EVENT_CALLBACK_URL:-http://host.docker.internal:8001/api/v1/callback/event}
      # 传感器配置
      SENSOR_AUTO_TRIGGER_DEFAULT_INTERVAL: ${SENSOR_AUTO_TRIGGER_DEFAULT_INTERVAL:-10}
      SENSOR_BARCODE_PREFIX: ${SENSOR_BARCODE_PREFIX:-PKG}
      # 日志配置
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/api/v1/device/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - wesp9-network
    deploy:
      resources:
        limits:
          cpus: ${MOCK_CPU_LIMIT:-0.25}
          memory: ${MOCK_MEMORY_LIMIT:-128M}
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILES:-3}"
    profiles:
      - test
      - e2e

  # ============================================
  # Mock 服务 - 机械臂设备模拟
  # ============================================
  mock_robot_arm:
    build:
      context: .
      dockerfile: tests/mock/Dockerfile
    image: wes-mock:robot_arm
    container_name: wes_mock_robot_arm_${ENV:-test}
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "${MOCK_ROBOT_ARM_PORT:-8004}:8004"
    working_dir: /app/tests/mock
    command: >
      python -m uvicorn
      robot_arm_mock_server:app
      --host 0.0.0.0
      --port 8004
      --log-level info
      --reload
    volumes:
      # 开发环境挂载 mock 服务源码（支持热更新）
      - ./tests/mock:/app/tests/mock:rw
    environment:
      # 服务配置
      APP_HOST: 0.0.0.0
      APP_PORT: 8004
      # WES 回调地址（使用 host.docker.internal 访问主机 API）
      WES_CALLBACK_URL: ${WES_CALLBACK_URL:-http://host.docker.internal:8001/api/v1/callback/result}
      # 日志配置
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/api/v1/device/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - wesp9-network
    deploy:
      resources:
        limits:
          cpus: ${MOCK_CPU_LIMIT:-0.25}
          memory: ${MOCK_MEMORY_LIMIT:-128M}
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILES:-3}"
    profiles:
      - test
      - e2e

# ============================================
# 网络配置
# ============================================
networks:
  wesp9-network:
    name: wesp9-${ENV:-prod}-network
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: wes_br_${ENV:-prod}
