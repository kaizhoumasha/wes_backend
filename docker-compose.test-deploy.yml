services:
  api:
    image: ${BACKEND_IMAGE:-wes-backend:local}
    container_name: wes_api_${ENV:-test}
    restart: ${RESTART_POLICY:-unless-stopped}
    entrypoint: ["/app/docker/test/api.entrypoint.sh"]
    ports:
      - "${APP_HOST_PORT:-8002}:8001"
    env_file:
      - .env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8001
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT}/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT}/2
      WMS_BASE_URL: ${WMS_BASE_URL}
      TRANSPORT_SUBMIT_PATH: ${TRANSPORT_SUBMIT_PATH}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON_OUTPUT: ${LOG_JSON_OUTPUT:-true}
    volumes:
      - ./logs:/app/logs:z
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wesp9-network

  celery:
    image: ${BACKEND_IMAGE:-wes-backend:local}
    container_name: wes_backend_test-celery-1
    restart: ${RESTART_POLICY:-unless-stopped}
    entrypoint: ["/app/docker/test/celery.entrypoint.sh"]
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT}/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT}/2
      CELERY_WORKER_QUEUES: default,celery,device-command
      CELERY_WORKER_CONCURRENCY: ${CELERY_CONCURRENCY:-4}
      WMS_BASE_URL: ${WMS_BASE_URL}
      TRANSPORT_SUBMIT_PATH: ${TRANSPORT_SUBMIT_PATH}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON_OUTPUT: ${LOG_JSON_OUTPUT:-true}
    volumes:
      - ./logs:/app/logs:z
    healthcheck:
      test: ["CMD-SHELL", "celery -A src.celery_app.app inspect ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wesp9-network

  # WMS fulfillment 专用 worker；继承同一 target endpoint，只收专用队列。
  celery-wms-fulfillment:
    extends:
      service: celery
    container_name: wes_backend_test-celery-wms-fulfillment-1
    environment:
      CELERY_WORKER_QUEUES: wms-fulfillment
      CELERY_WORKER_CONCURRENCY: "1"
    deploy:
      replicas: 1

  celery_beat:
    extends:
      service: celery
    container_name: wes_celery_beat_${ENV:-test}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - exec /opt/venv/bin/celery -A src.celery_app.app beat --loglevel=${CELERY_LOG_LEVEL:-INFO}
    environment:
      DATABASE_RUNTIME_ROLE: cli
      DATABASE_POOL_SIZE: 1
      DATABASE_MAX_OVERFLOW: 0
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "tr '\\000' ' ' </proc/1/cmdline | grep -q 'celery.*beat' || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  flower:
    image: ${BACKEND_IMAGE:-wes-backend:local}
    container_name: wes_flower_${ENV:-test}
    restart: ${RESTART_POLICY:-unless-stopped}
    command:
      - /opt/venv/bin/celery
      - -A
      - src.celery_app.app
      - flower
      - --port=5555
      - --broker=redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT}/1
      - --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-changeme}
    env_file:
      - .env
    environment:
      DATABASE_RUNTIME_ROLE: cli
      DATABASE_POOL_SIZE: 1
      DATABASE_MAX_OVERFLOW: 0
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT}/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT}/2
    healthcheck:
      test: ["CMD", "curl", "-sS", "http://127.0.0.1:5555/"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - wesp9-network

  frontend:
    image: ${FRONTEND_IMAGE:-wes-frontend:local}
    container_name: wes_frontend_${ENV:-test}
    restart: ${RESTART_POLICY:-unless-stopped}
    expose:
      - "5173"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:5173/",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - wesp9-network

  nginx:
    image: nginx:1.27-alpine
    container_name: wes_nginx_${ENV:-test}
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
      - "${NGINX_HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ${NGINX_SSL_DIR:-./nginx/ssl}:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx:z
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - wesp9-network

  db:
    image: timescale/timescaledb@sha256:6e4b469dee0395a8a6d8c818384b0226a749997a29a312f314413f98e4161f82
    container_name: wes_postgres_${ENV:-test}
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - ./docker_data/postgres_${ENV:-test}:/var/lib/postgresql/data
      - ${POSTGRES_CONFIG_FILE:-./postgresql/postgresql.conf}:/etc/postgresql/postgresql.conf:ro
      - ./postgresql/base.conf:/etc/postgresql/base.conf:ro
      - ${BACKUP_DIR:-./backups}:/backups
    command: ${POSTGRES_COMMAND:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wesp9-network

  redis:
    image: redis:8-alpine
    container_name: wes_redis_${ENV:-test}
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - ./docker_data/redis_${ENV:-test}:/data
      - ${REDIS_CONFIG_FILE:-./redis/redis.conf}:/usr/local/etc/redis/redis.conf:ro
      - ./redis/base.conf:/usr/local/etc/redis/base.conf:ro
    command: ${REDIS_COMMAND:-redis-server /usr/local/etc/redis/redis.conf} --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wesp9-network

networks:
  wesp9-network:
    name: ${COMPOSE_PROJECT_NAME:-wes_backend_test}-network
    driver: bridge
